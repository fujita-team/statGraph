name: Ubuntu

on:
  pull_request:
    branches:
        - '**'
  push:
    branches:
        - '**'
env:
  DISABLE_RENV: 1
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: chavauty/statgraph-base:macos
    steps:
    - uses: actions/checkout@v3
    - name: Build
      working-directory: ${{github.workspace}}
      run: Rscript build.r

